<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="BioLog: análisis anual mensualizado de jornales e insumos de laboratorio." />
    <title>BioLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const onGitHubPages = location.hostname.endsWith('github.io') && location.pathname.startsWith('/bio')
      if (onGitHubPages) {
        const stylesheet = document.createElement('link')
        stylesheet.rel = 'stylesheet'
        stylesheet.href = '/bio/assets/biolog.css'
        document.head.appendChild(stylesheet)
        await import('/bio/assets/biolog.js')
      } else {
        await import('/bio/src/main.tsx')
      }
    </script>
  </body>
</html>
