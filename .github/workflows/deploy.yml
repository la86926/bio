name: Build BioLog for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biolog-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Publish generated assets to main
        shell: bash
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/biolog-config.json ./biolog-config.json
          cp dist/BioLog_Ejemplo.xlsx ./BioLog_Ejemplo.xlsx
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets biolog-config.json BioLog_Ejemplo.xlsx .nojekyll
          if git diff --cached --quiet; then
            echo "Generated site is already current."
            exit 0
          fi
          git commit -m "build: publish BioLog assets"
          git push
