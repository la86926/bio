name: Build BioLog source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-source:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'BioLog bootstrap trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          payload = "".join(
              Path(f".bootstrap/chunk{i:02d}").read_text(encoding="utf-8").strip()
              for i in range(8)
          )
          manifest = json.loads(gzip.decompress(base64.b64decode(payload)).decode("utf-8"))

          for path, content in manifest.get("text", {}).items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          for path, content in manifest.get("binary", {}).items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(content))

          Path("src/vite-env.d.ts").write_text('/// <reference types="vite/client" />\\n', encoding="utf-8")
          print(f"Reconstructed {len(manifest.get('text', {}))} text files and {len(manifest.get('binary', {}))} binary files.")
          PY

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build complete BioLog application"
          git push
